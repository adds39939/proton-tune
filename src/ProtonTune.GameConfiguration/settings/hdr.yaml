id: hdr
title: HDR
order: 3

settings:
  - variable: PROTON_ENABLE_HDR
    label: Enable HDR in Proton
    description: Lets Proton advertise HDR support to the game. Needs a Wayland session.
    kind: toggle
    protonBuilds: ["^GE-Proton"]
    restrictToProtonBuild: true

  - variable: PROTON_USE_HDR
    label: Enable HDR in Proton (older name)
    description: >-
      The same switch under the name it was introduced with. GE-Proton reads both spellings, so
      there is nothing to gain by moving, and one of the two is enough.
    kind: toggle
    protonBuilds: ["^GE-Proton"]
    restrictToProtonBuild: true
    hideUnlessSet: true

  - variable: DXVK_HDR
    label: Enable HDR in DXVK
    description: Turns on HDR output in the D3D-to-Vulkan layer.
    kind: toggle

  - variable: DXVK_NO_HDR
    label: Refuse HDR in DXVK
    description: >-
      Stops DXVK offering HDR whatever else asks for it, which is the way back to SDR for a game
      that renders HDR badly. Present in proton-cachyos's DXVK; other builds ignore it.
    kind: toggle
    protonBuilds: ["^(proton-)?cachyos"]
